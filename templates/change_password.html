<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Data Extraction Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#0b1120;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e2e8f0
}
.bg-glow{
  position:fixed;top:-200px;left:50%;transform:translateX(-50%);
  width:700px;height:400px;
  background:radial-gradient(ellipse,rgba(99,102,241,0.1),transparent 70%);
  pointer-events:none
}
.card{
  position:relative;
  width:420px;max-width:92vw;
  background:rgba(30,41,59,0.7);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(99,102,241,0.12);
  border-radius:24px;
  padding:40px 36px 36px;
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
  animation:fadeSlideUp .45s ease
}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
h1{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px}
.sub{text-align:center;color:#64748b;font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#818cf8;margin-bottom:5px;letter-spacing:.02em}
.form-group .input-wrap{
  position:relative;display:flex;align-items:center;
  background:rgba(15,23,42,0.8);
  border:1px solid rgba(99,102,241,0.12);border-radius:12px;transition:all .2s
}
.form-group .input-wrap:focus-within{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.1)}
.form-group .input-wrap i{position:absolute;left:14px;color:#475569;font-size:15px}
.form-group input{
  width:100%;padding:12px 14px 12px 40px;
  background:transparent;border:none;color:#e2e8f0;
  font-size:14px;font-family:inherit;outline:none
}
.form-group input::placeholder{color:#475569}
.btn{
  width:100%;padding:12px;border:none;border-radius:12px;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  box-shadow:0 4px 15px rgba(99,102,241,0.25);
  transition:all .25s ease;display:flex;align-items:center;justify-content:center;gap:8px
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.35)}
.error{
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.15);
  color:#fca5a5;padding:10px 14px;border-radius:10px;
  font-size:13px;margin-bottom:18px;text-align:center
}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <h1><i class="fa fa-key" style="color:#818cf8;margin-right:8px"></i> Change Password</h1>
  <p class="sub">Your admin password must be updated.</p>

  {% if error %}
  <div class="error"><i class="fa fa-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('change_password') }}">
    <div class="form-group">
      <label>Current Password</label>
      <div class="input-wrap">
        <i class="fa fa-lock"></i>
        <input type="password" name="current_password" placeholder="Enter current password" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label>New Password <span style="color:#f87171">*</span></label>
      <div class="input-wrap">
        <i class="fa fa-key"></i>
        <input type="password" name="new_password" placeholder="Min 4 characters" required>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password <span style="color:#f87171">*</span></label>
      <div class="input-wrap">
        <i class="fa fa-check"></i>
        <input type="password" name="confirm_password" placeholder="Re-enter new password" required>
      </div>
    </div>
    <button type="submit" class="btn"><i class="fa fa-save"></i> Update Password</button>
  </form>
</div>
</body>
</html>
